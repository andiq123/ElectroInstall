<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <title>Cerere contact ElectroInstall</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin:0;padding:0;width:100%;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;background-color:#0f0f0f;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#0f0f0f;">
    <tr>
      <td align="center" style="padding:48px 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;">
          <tr>
            <td style="border-top:4px solid #facc15;padding-top:32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:600;color:#ffffff;letter-spacing:-0.02em;">ElectroInstall</td>
                  <td align="right" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:500;color:#a1a1aa;">Cerere nouă</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding-top:40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="padding-bottom:6px;font-size:13px;font-weight:500;color:#71717a;">Nume</td>
                </tr>
                <tr>
                  <td style="font-size:17px;font-weight:600;color:#ffffff;line-height:1.4;">{{name}}</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="padding-bottom:6px;font-size:13px;font-weight:500;color:#71717a;">Telefon</td>
                </tr>
                <tr>
                  <td><a href="tel:{{phone}}" style="font-size:17px;font-weight:600;color:#facc15;text-decoration:none;">{{phone}}</a></td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding-top:28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td style="padding-bottom:6px;font-size:13px;font-weight:500;color:#71717a;">Mesaj</td>
                </tr>
                <tr>
                  <td style="padding:20px;background-color:#18181b;border:1px solid #27272a;">
                    <p style="margin:0;font-size:15px;line-height:1.6;color:#d4d4d8;">{{message}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding-top:48px;border-top:1px solid #27272a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;color:#52525b;">Formular contact · electro-install.vercel.app</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
